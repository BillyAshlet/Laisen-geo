<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>城市空间规划情景模拟</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Dark bars top and bottom frame the light working area. -->
<header class="top dark">
  <div class="title">
    <span class="mark"></span>
    <h1 data-i18n="title"></h1>
  </div>
  <nav class="seg" id="mode">
    <button class="block on" data-mode="city" data-i18n="modeCity"></button>
    <button class="block" data-mode="sandbox" data-i18n="modeSandbox"></button>
  </nav>
  <div class="spacer"></div>
  <button class="block ochre" id="reveal" data-i18n="reveal"></button>
  <button class="block" id="lang">EN</button>
</header>

<main class="layout" id="layout">
  <aside class="tools">
    <h2 data-i18n="toolsHead"></h2>
    <div id="toolbar" class="palette"></div>

    <h2 data-i18n="blockHead"></h2>
    <div id="blockPanel" class="blockpanel"></div>

    <h2 data-i18n="constraintsHead"></h2>
    <div id="constraints" class="constraints"></div>

    <button class="block ochre ask" id="ask" data-i18n="askAgent"></button>
  </aside>

  <section class="mapwrap">
    <figure class="neatline main">
      <canvas id="map"></canvas>
      <div class="north">N<span>▲</span></div>
      <div class="scale"><span></span><em>3 km</em></div>
    </figure>
    <div class="hint" data-i18n="mapHint"></div>
  </section>

  <aside class="panel">
    <div class="smalls" id="smalls"></div>
  </aside>

  <!-- Agent evaluation: takes over the working area so the analysis is the thing you look at. -->
  <section id="av" class="av hidden">
    <header class="avhead"><span id="avTitle"></span><button class="block" id="avClose"></button></header>
    <div class="avbody">
      <figure class="neatline avmap"><canvas id="avMap" width="720" height="720"></canvas><figcaption id="avCap"></figcaption></figure>
      <div class="avside">
        <ol id="avSteps"></ol>
        <figure class="neatline avsc"><canvas id="avScatter" width="560" height="190"></canvas><figcaption id="avScCap"></figcaption></figure>
        <div id="avCards"></div>
      </div>
    </div>
  </section>
</main>

<footer class="term dark">
  <figure class="neatline trade" data-i18n-title="tradeCap">
    <canvas id="trade"></canvas>
  </figure>
  <div class="readouts" id="readouts"></div>
  <div class="logwrap">
    <div class="termhead"><span data-i18n="agentHead"></span><em data-i18n="placeholderNote"></em></div>
    <ol id="log"></ol>
  </div>
</footer>

<script src="i18n.js"></script>
<script src="palette.js"></script>
<script src="data/changchun.js"></script>
<script src="engine.js"></script>
<script src="agent.js"></script>
<script src="ui.js"></script>
</body>
</html>
